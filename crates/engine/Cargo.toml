[package]
name = "engine"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }

reqwest = { version = "0.13.4", features = [
    "gzip",
    "brotli",
    "deflate",
    "cookies",
    "rustls",
] }

scraper = "0.27"

anyhow = "1"

async-trait = "0.1"

url = "2"

time = "=0.3.53"

tracing = "0.1"
tracing-subscriber = "0.3"

regex = "1"


serde = { version = "1", features = ["derive"] }
serde_json = "1"