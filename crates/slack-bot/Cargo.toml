[package]
name = "slack-bot"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }


serde = { version = "1", features = ["derive"] }
serde_json = "1"

tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }

tracing = "0.1"
tracing-subscriber = "0.3"

hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

dotenvy = "0.15"

thiserror = "2"

reqwest = { version = "0.13.4", features = ["json", "rustls"] }

async-trait = "0.1"

anyhow = "1"

engine = { path = "../engine" }